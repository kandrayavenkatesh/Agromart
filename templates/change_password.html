{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Change Password - AgroMart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body class="change-password-page">

    <nav class="navbar">
        <h2>AgroMart</h2>
        <ul>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'my_account' %}">My Account</a></li>
        </ul>
    </nav>

    <div class="change-password-container">

        <div class="change-password-card">

            <div class="change-password-heading">
                <h1>Change Password</h1>
                <p>Update your account password securely.</p>
            </div>

            <form method="POST">
                {% csrf_token %}

                {{ form.non_field_errors }}

                <div class="password-form-fields">
                    {{ form.as_p }}
                </div>

                <button type="submit" class="password-update-btn">
                    Update Password
                </button>
            </form>

            <div class="password-back-link">
                <a href="{% url 'my_account' %}">← Back to My Account</a>
            </div>

        </div>

    </div>

    <footer>
        <p>© 2026 AgroMart. All Rights Reserved.</p>
    </footer>

</body>
</html>
